worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Define a log format for error responses
    log_format error_log '$remote_addr - $remote_user [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';
    
    # Only log requests with 4xx or 5xx status codes
    map $status $loggable {
        ~^[45] 1;
        default 0;
    }
    
    # Conditional access logging (only errors)
    access_log /dev/stdout error_log if=$loggable;
    
    # Log only nginx-level errors and above (error, crit, alert, emerg)
    error_log /dev/stderr error;
    
    # Use frontendId query parameter for sticky sessions
    # Falls back to IP address if frontendId is not present
    map $arg_frontendId $route_key {
        "" $remote_addr;
        default $arg_frontendId;
    }

    upstream backend {
        # Hash based on frontendId for consistent routing
        # This ensures all requests with the same frontendId go to the same backend
        # Allows better load distribution from single IP (localhost) during testing
        hash $route_key consistent;
        
        # Explicitly list each backend replica
        # Docker Compose creates containers with names: <project>-<service>-<replica>
        server chat-backend-1:3000;
        server chat-backend-2:3000;
        server chat-backend-3:3000;
    }

    server {
        listen 3000;
        
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts for long-lived connections
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}

